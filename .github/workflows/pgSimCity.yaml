name: build pgSimCity

permissions:
  id-token: write
  attestations: write
  artifact-metadata: write

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: NikolayS/PGSimCity
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck
      
      - name: Change Path
        run: sed '/^[[:space:]]*base:/ s#\./#/pg/#' vite.config.ts

      - name: Build
        run: npm run build

      - name: Compress file
        run: tar -zcvf pgsimcity.tar.gz ./dist/*
      
      - name: Upload
        uses: actions/attest@v4
        with:
          subject-path: './pgsimcity.tar.gz'