name: build harper editor

permissions:
  id-token: write
  attestations: write
  artifact-metadata: write

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build
    steps:
      - name: Checkout current repo (for harper-editor/)
        uses: actions/checkout@v4

      - name: Checkout Automattic/harper
        uses: actions/checkout@v4
        with:
          repository: Automattic/harper
          path: harper-monorepo
          ref: master

      - name: Copy host project into monorepo
        run: |
          mkdir -p harper-monorepo/packages/my-editor
          cp -r harper-editor/. harper-monorepo/packages/my-editor/
          rm -f harper-monorepo/packages/my-editor/pnpm-workspace.yaml

      - name: Install system dependencies for wasm-pack
        run: sudo apt-get update -y && sudo apt-get install -y clang

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: harper-monorepo/harper-wasm -> harper-monorepo

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Build harper-wasm (full)
        working-directory: harper-monorepo/harper-wasm
        run: wasm-pack build --target web --out-name harper_wasm

      - name: Build harper-wasm (slim)
        working-directory: harper-monorepo/harper-wasm
        run: wasm-pack build --target web --out-name harper_wasm_slim --no-default-features

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install monorepo dependencies
        working-directory: harper-monorepo
        run: pnpm install --frozen-lockfile

      - name: Build harper.js
        working-directory: harper-monorepo/packages/harper.js
        run: pnpm run build

      - name: Build lint-framework
        working-directory: harper-monorepo/packages/lint-framework
        run: pnpm run build

      - name: Build components
        working-directory: harper-monorepo/packages/components
        run: pnpm run prepack

      - name: Build harper-editor library
        working-directory: harper-monorepo/packages/harper-editor
        run: pnpm run prepack

      - name: Build my-editor
        working-directory: harper-monorepo/packages/my-editor
        run: pnpm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: harper-editor
          path: ./harper-monorepo/packages/my-editor/build/*
