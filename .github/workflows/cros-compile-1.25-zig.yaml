name: build cross-compile docker images for go-1.25 and zig-0.16.0

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create Necessary Directory
        run: mkdir -p cross-compile/loong-gcc8 cross-compile/loong-go

      - name: Download LoongArch64 GCC 8.3.0 Cross Toolchain
        run: |
          curl -fsSL https://ftp.loongnix.cn/toolchain/gcc/release/loongarch/gcc8/loongson-gnu-toolchain-8.3-x86_64-loongarch64-linux-gnu-rc1.6.tar.xz \
            | tar -Jxv -C cross-compile/loong-gcc8 --strip-components=1

      - name: Download LoongArch64 Go 25.11
        run: |
          curl -fsSL https://ftp.loongnix.cn/toolchain/golang/go-1.25/abi1.0/go1.25.11.linux-amd64.tar.gz \
            | tar -zxv -C cross-compile/loong-go --strip-components=1

      # 关键优化：在宿主机端就地精简工具链，避免进入 Docker 镜像后产生 CoW 层重写膨胀
      - name: Strip and Clean Loong Toolchains
        run: |
          echo "Cleaning documentation, locales, and tests..."
          rm -rf cross-compile/loong-gcc*/share/{doc,man,info,locale}
          rm -rf cross-compile/loong-go/{doc,test,api}
          find cross-compile/loong-go/src -name "*_test.go" -delete
          
          echo "Stripping binaries to remove debug info..."
          find cross-compile/loong-gcc* -type f -executable -exec strip --strip-unneeded {} + 2>/dev/null || true

      - name: Set Image Tag
        run: echo "IMAGE_TAG=$(date '+%Y%m%d')" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build \
            -f cross-compile/Dockerfile-1.25-zig \
            -t cross-compile:${{ env.IMAGE_TAG }} \
            cross-compile

      - name: Save and compress image
        run: |
          sudo apt-get update && sudo apt-get install -y pigz
          docker save cross-compile:${{ env.IMAGE_TAG }} | pigz -p 4 > cross-compile.tar.gz

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cross-compile-${{ env.IMAGE_TAG }}
          name: Release cross-compile-${{ env.IMAGE_TAG }}
          body: |
            Docker image built from cross-compile/Dockerfile-1.25-zig
            Generated by workflow run #${{ github.run_number }}
            
            Build Components:
            - Go 1.25
            - Zig 0.16.0
            - LoongArch64 GCC 8.3.0 Cross Toolchain
            - LoongArch64 Go 1.25.11
          files: cross-compile.tar.gz
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
