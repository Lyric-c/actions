name: build nginx brotli docker images

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
        dockerfile_path:
            description: "path to Dockerfile"
            required: true
        modules:
            description: "need to build modules"
            required: true
        image_tag:
            description: "nginx image tag"

jobs:
    build-and-upload:
        runs-on: ubuntu-latest
        name: Deploy
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3
            
            - name: Build Docker image
              run: |
                docker build \ 
                  -f ${{ github.event.inputs.dockerfile_path }} \
                  --build-arg ENABLED_MODULES= ${{ github.event.inputs.modules }} \
                  -t nginx:${{ github.event.inputs.image_tag }} \
                  .
            - name: Save and compress image
              run: |
                docker save nginx:${{ github.event.inputs.image_tag }} | gzip > nginx_${{ github.event.inputs.image_tag }}.tar.gz

            - name: Create Release and Upload Asset
              uses: softprops/action-gh-release@v1
              with:
                tag_name: nginx_${{ github.event.inputs.image_tag }}
                name: Release for nginx:${{ github.event.inputs.image_tag }}
                body: |
                    Docker image built from ${{ github.event.inputs.dockerfile_path }}
                    Generated by workflow run #${{ github.run_number }}
                files: nginx_${{ github.event.inputs.image_tag }}.tar.gz
                generate_release_notes: true

              env: 
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}